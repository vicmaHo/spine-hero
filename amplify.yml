# Especificación de build de AWS Amplify Hosting.
#
# Sin este fichero, Amplify solo construía el frontend: el log decía
# «No backend environment association found» con `backendDuration: 0`, así que
# nada generaba `amplify_outputs.json` y `src/main.tsx`, que lo importa de
# forma estática, fallaba con «Cannot find module '../amplify_outputs.json'».
# Ese fichero está en `.gitignore` a propósito y no se commitea.
#
# La fase `backend` lo resuelve: `ampx pipeline-deploy` despliega la carpeta
# `amplify/` para esta rama y escribe `amplify_outputs.json` en la raíz del
# repositorio dentro del contenedor de build. La fase `frontend` se ejecuta
# después, en el mismo contenedor, y ya lo encuentra.
#
# Ojo: el backend de la rama es DISTINTO del sandbox de desarrollo. Son dos
# juegos de tablas DynamoDB independientes, así que los nicks y los DailyRecord
# creados con `npx ampx sandbox` no aparecen en el sitio desplegado. El sandbox
# sigue sirviendo para desarrollo local sin cambios.
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        # $AWS_BRANCH y $AWS_APP_ID los inyecta Amplify en el entorno de build.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    # `vite build` escribe en dist/ (por defecto, no se cambia en vite.config.ts).
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
